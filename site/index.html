<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <meta name="description" content="Your research agent: see what it found and change how it works.">
  <title>Research agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='16' width='5' height='11' rx='1' fill='%231f4fd8'/%3E%3Crect x='13.5' y='6' width='5' height='21' rx='1' fill='%231f4fd8'/%3E%3Crect x='22' y='11' width='5' height='16' rx='1' fill='%231f4fd8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header class="masthead">
      <div class="title-row">
        <h1>Research agent</h1>
        <div id="actions" class="actions" hidden>
          <button id="btn-pause" type="button" class="btn"></button>
          <button id="btn-run" type="button" class="btn primary">Run now</button>
        </div>
      </div>
      <p id="status" class="status" role="status">Loading.</p>
      <nav id="tabs" class="tabs" aria-label="Sections" hidden>
        <button type="button" role="tab" data-tab="digests" aria-selected="true">Results</button>
        <button type="button" role="tab" data-tab="settings" aria-selected="false">Settings</button>
      </nav>
    </header>
    <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
    <main id="main" tabindex="-1"></main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
