name: research-agent

on:
  schedule:
    # GitHub cron is UTC. 02:30 UTC = 08:00 IST, every day.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build the digest as an artifact, do not email or save state)"
        type: boolean
        default: false

permissions:
  contents: write # lets the job commit state/seen.json back to the repo

concurrency:
  group: research-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python -m agent.main ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload dry-run digest
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: out/

      - name: Commit state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "research-agent[bot]"
          git config user.email "research-agent@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "chore: update seen state"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
